<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}VPN Control Center{% endblock %}</title><link rel="stylesheet" href="/static/app.css"><script defer src="/static/app.js"></script></head><body><div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">V</div><div><strong>VPN CONTROL</strong><small>مرکز مدیریت</small></div></div><nav><a href="/" class="nav-item {% if request.url.path == '/' %}active{% endif %}"><span>◈</span> داشبورد</a><a href="/users" class="nav-item {% if request.url.path.startswith('/users') %}active{% endif %}"><span>👥</span> کاربران</a><a href="/debts" class="nav-item {% if request.url.path == '/debts' %}active{% endif %}"><span>◴</span> مطالبات</a><a href="/payments" class="nav-item {% if request.url.path == '/payments' %}active{% endif %}"><span>✓</span> پرداخت‌ها</a><a href="/servers" class="nav-item {% if request.url.path.startswith('/servers') %}active{% endif %}"><span>▣</span> سرورها</a><a href="/traffic" class="nav-item {% if request.url.path == '/traffic' %}active{% endif %}"><span>⌁</span> ترافیک</a><a href="/settings" class="nav-item {% if request.url.path == '/settings' %}active{% endif %}"><span>⚙</span> تنظیمات</a></nav><div class="sidebar-foot"><div class="safe-badge"><i></i> X-UI فقط خواندنی</div><form method="post" action="/logout"><button class="ghost-btn full">خروج</button></form></div></aside><main class="main"><header class="topbar"><button class="menu-btn" data-menu>☰</button><div><div class="eyebrow">مرکز فرمان VPN</div><h1>{% block heading %}داشبورد{% endblock %}</h1></div><div class="top-actions"><div class="live-dot"><i></i> سیستم فعال</div>{% block actions %}{% endblock %}</div></header><section class="content">{% block content %}{% endblock %}</section></main></div></body></html>
