<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>پنل مشترکین</title>
<link rel="stylesheet" href="/assets/v2.css">\n<link rel="stylesheet" href="/assets/v2_polish.css">
</head>
<body>
<main class="login-shell">
  <section class="login-panel">
    <div class="login-head">
      <div class="hero-logo"><img src="/assets/logo.png" alt="VPN"></div>
      <h1>پنل مشترکین</h1>
      <p>شماره موبایلی که اکانت با آن ثبت شده را وارد کنید تا مستقیم وارد پنل شوید.</p>
    </div>

    {% if error %}<div class="flash bad">{{ error }}</div>{% endif %}

    <form method="post" action="/login">
      <div class="field">
        <label>شماره موبایل</label>
        <input name="phone" inputmode="tel" autocomplete="tel" placeholder="0912..." required autofocus>
      </div>
      <button class="login-btn" type="submit">ورود به پنل ←</button>
    </form>

    <div class="login-note">فقط شماره‌هایی که در سیستم ثبت شده‌اند امکان ورود دارند.</div>
  </section>
</main>
</body>
</html>
