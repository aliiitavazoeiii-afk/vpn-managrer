<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081b26"><title>نتیجه پرداخت | User Manager</title><style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');
:root{color-scheme:dark;font-family:Vazirmatn,Tahoma,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 0%,#164c50 0%,#0b2630 40%,#07151f 100%);color:#f2fcfa;display:grid;place-items:center;padding:22px;overflow-x:hidden}.glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 30%,#42e5ad15,transparent 55%)}main{position:relative;width:min(100%,480px);text-align:center;background:linear-gradient(145deg,#12333dcc,#0c202de8);border:1px solid #ffffff20;border-radius:32px;padding:42px 25px 28px;box-shadow:0 24px 85px #0008;animation:enter .75s cubic-bezier(.18,.85,.3,1) both}.symbol{margin:auto;width:108px;height:108px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,#a3ffd4,#28ca93);color:#08382c;box-shadow:0 0 0 14px #42e6a111,0 0 55px #40e5a744;animation:pop .9s .1s both}.symbol svg{width:56px}h1{font-size:clamp(25px,6vw,33px);margin:29px 0 8px;font-weight:900;letter-spacing:-.6px}p{color:#b6d0d1;line-height:2;margin:0 0 22px}.detail{background:#ffffff0b;border:1px solid #ffffff14;border-radius:18px;padding:15px 17px;text-align:right;margin:20px 0}.detail div{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-bottom:1px solid #ffffff12}.detail div:last-child{border:0}.detail span{color:#a9c3c8;font-size:13px}.detail strong{font-size:14px;overflow-wrap:anywhere}.accounts{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:14px 0}.accounts span{padding:7px 11px;background:#48e3ac19;border:1px solid #48e3ac38;border-radius:999px;font-size:12px}.action{display:block;text-decoration:none;background:linear-gradient(110deg,#64eeb8,#2fd69d);color:#063b2d;border-radius:16px;padding:15px;font-weight:900;margin-top:22px;transition:transform .2s,box-shadow .2s}.action:hover{transform:translateY(-2px);box-shadow:0 12px 28px #3ed9a333}.note{font-size:12px;color:#83a6ae;margin-top:15px}.confetti{position:fixed;top:-25px;width:9px;height:17px;border-radius:2px;pointer-events:none;animation:fall var(--duration) linear forwards;left:var(--left);background:var(--color);transform:rotate(var(--rot))}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(920deg);opacity:.15}}@keyframes pop{from{transform:scale(.25);opacity:0}65%{transform:scale(1.13)}to{transform:scale(1);opacity:1}}@keyframes enter{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><div class="glow"></div><main><div class="symbol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg></div><h1>پرداختت با موفقیت انجام شد! 🎉</h1><p>تمدید اشتراکت ثبت شد. از همراهی‌ات ممنونیم!</p><div class="accounts">{% for a in accounts %}<span>{{ a.name }} · تا {{ a.expiry }}</span>{% endfor %}</div><div class="detail"><div><span>مبلغ پرداخت</span><strong>{{ amount }} تومان</strong></div><div><span>شماره پیگیری آیریا</span><strong id="tracking">{{ tracking }}</strong></div><div><span>وضعیت</span><strong style="color:#72f2b8">تأیید و ثبت نهایی شده</strong></div></div><a class="action" href="/">ورود به داشبورد ←</a><div class="note">شماره پیگیری را برای مراجعات بعدی نگه دار.</div></main><script>if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const colors=['#5ce3af','#ffe38b','#8fd9ff','#fc90c4','#f4f9ff'];for(let i=0;i<95;i++){const p=document.createElement('i');p.className='confetti';p.style.setProperty('--left',Math.random()*100+'vw');p.style.setProperty('--duration',2.7+Math.random()*3+'s');p.style.setProperty('--color',colors[i%colors.length]);p.style.setProperty('--rot',Math.random()*360+'deg');p.style.setProperty('--drift',(Math.random()*220-110)+'px');p.style.animationDelay=Math.random()*1.1+'s';document.body.appendChild(p);p.addEventListener('animationend',()=>p.remove())}}</script></body></html>
