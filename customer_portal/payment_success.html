<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>پرداخت با موفقیت انجام شد | User Manager</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');
:root{color-scheme:light;font-family:Vazirmatn,Tahoma,Arial,sans-serif;color:#111;background:#fff}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:#fff;padding:25px 14px}
main{width:min(100%,476px);background:#fff;padding:40px 28px 28px;border:1px solid #e8e8e8;border-radius:26px;text-align:center;box-shadow:0 19px 60px #0000000a;animation:enter .65s cubic-bezier(.18,.84,.28,1) both}
.symbol{height:92px;width:92px;display:grid;place-items:center;margin:0 auto;background:#111;color:#fff;border-radius:50%;box-shadow:0 0 0 11px #f4f4f4;animation:pop .8s .1s both}
.symbol svg{height:48px;width:48px}
h1{margin:29px 0 8px;font-weight:900;font-size:clamp(23px,5.3vw,30px);letter-spacing:-.6px}
.subtitle{margin:0 0 25px;color:#717171;font-size:15px}
.receipt{background:#fafafa;border:1px solid #ebebeb;border-radius:17px;padding:6px 17px;margin:0 0 19px;text-align:right}
.line{display:flex;align-items:center;justify-content:space-between;gap:13px;padding:17px 2px;border-bottom:1px solid #e7e7e7}
.line:last-child{border-bottom:0}
.label{font-size:13px;color:#777;white-space:nowrap}
.line strong{font-size:14px;color:#151515;font-weight:800;max-width:62%;text-align:left;overflow-wrap:anywhere}
#tracking{direction:ltr;unicode-bidi:plaintext;font-variant-numeric:tabular-nums}
.actions{display:grid;gap:10px}
.action{min-height:51px;padding:12px;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:9px;width:100%;font:800 14px Vazirmatn,Tahoma,Arial,sans-serif;text-decoration:none;cursor:pointer;border:1px solid #111;transition:transform .2s,background .2s}
.action:hover{transform:translateY(-2px)}
.action:focus-visible{outline:3px solid #888;outline-offset:3px}
.action.primary{color:#fff;background:#111}
.action.primary:hover{background:#292929}
.action.secondary{color:#111;background:#fff}
.action.secondary:hover{background:#f5f5f5}
.action:disabled{opacity:.5;cursor:wait}
.action svg{height:19px;width:19px;flex-shrink:0}
#share-status{font-size:12px;line-height:1.9;color:#5c5c5c;margin:10px 0 0}
#share-status:empty{display:none}
#share-status a{color:#111;font-weight:800;text-underline-offset:3px}
.confetti{position:fixed;top:-25px;width:6px;height:12px;pointer-events:none;background:var(--color);left:var(--left);animation:fall var(--duration) linear forwards;transform:rotate(var(--rot))}
@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(880deg);opacity:0}}
@keyframes pop{from{transform:scale(.3);opacity:0}65%{transform:scale(1.08)}to{transform:scale(1);opacity:1}}
@keyframes enter{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:420px){main{padding:34px 17px 22px}.receipt{padding:4px 12px}.line{padding:15px 1px}.label{font-size:12px}.line strong{font-size:13px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
@media print{body{padding:0}main{border:0;box-shadow:none}.actions,#share-status,.confetti{display:none!important}}
</style>
</head>
<body>
<main>
  <div class="symbol" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>
  </div>
  <h1>پرداخت با موفقیت انجام شد</h1>
  <p class="subtitle">از همراهیت ممنونیم</p>
  <section class="receipt" aria-label="اطلاعات رسید پرداخت">
    <div class="line"><span class="label">نام اکانت پرداخت‌شده</span><strong id="account-name">{{ account_label }}</strong></div>
    <div class="line"><span class="label">سررسید بعدی</span><strong id="next-due">{{ next_due }}</strong></div>
    <div class="line"><span class="label">شماره پیگیری آیریا</span><strong id="tracking">{{ tracking }}</strong></div>
    <div class="line"><span class="label">وضعیت</span><strong>پرداخت تأیید شد</strong></div>
  </section>
  <div class="actions">
    <a class="action primary" href="/">ورود به داشبورد ←</a>
    <button type="button" class="action secondary" id="share-whatsapp">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19.2 4.8a9 9 0 0 0-14.3 10.6L4 20l4.7-1a9 9 0 1 0 10.5-14.2Z"/><path d="M9 9.3c.9 2.4 2.6 4.1 5.1 5.1l1.5-1.2 2 1a2.4 2.4 0 0 1-2.6 2.2c-3.7-.5-7-3.7-7.5-7.4A2.4 2.4 0 0 1 9.7 6.5l1 2Z"/>
      </svg>
      اشتراک‌گذاری رسید در واتساپ
    </button>
  </div>
  <p id="share-status" role="status" aria-live="polite"></p>
</main>
<script>
(function(){
  const account={{ account_label|tojson }};
  const expiry={{ next_due|tojson }};
  const tracking={{ tracking|tojson }};
  const whatsappUrl={{ whatsapp_url|tojson }};
  const button=document.getElementById('share-whatsapp');
  const status=document.getElementById('share-status');
  const shareText='رسید پرداخت VPN\nنام اکانت: '+account+'\nسررسید بعدی: '+expiry+'\nشماره پیگیری آیریا: '+tracking+'\nوضعیت: پرداخت تأیید شد';

  async function createReceiptImage(){
    if(document.fonts){try{await document.fonts.ready}catch(e){}}
    const canvas=document.createElement('canvas'),scale=2;
    canvas.width=900*scale;canvas.height=650*scale;
    const ctx=canvas.getContext('2d');
    if(!ctx)throw new Error('canvas_unavailable');
    ctx.scale(scale,scale);
    ctx.fillStyle='#fff';ctx.fillRect(0,0,900,650);
    ctx.beginPath();ctx.arc(450,93,48,0,Math.PI*2);ctx.fillStyle='#111';ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=8;ctx.lineJoin='round';ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(425,91);ctx.lineTo(444,108);ctx.lineTo(479,75);ctx.stroke();
    ctx.textAlign='center';ctx.direction='rtl';
    ctx.fillStyle='#111';ctx.font='900 32px Vazirmatn, Tahoma, sans-serif';
    ctx.fillText('پرداخت با موفقیت انجام شد',450,189);
    ctx.fillStyle='#666';ctx.font='500 21px Vazirmatn, Tahoma, sans-serif';
    ctx.fillText('از همراهیت ممنونیم',450,229);
    ctx.fillStyle='#fafafa';ctx.fillRect(90,276,720,330);
    ctx.strokeStyle='#e5e5e5';ctx.lineWidth=1;ctx.strokeRect(90,276,720,330);
    const rows=[['نام اکانت پرداخت‌شده',account],['سررسید بعدی',expiry],['شماره پیگیری آیریا',tracking],['وضعیت','پرداخت تأیید شد']];
    rows.forEach(function(row,i){
      const y=329+i*81;
      if(i){ctx.strokeStyle='#e5e5e5';ctx.beginPath();ctx.moveTo(112,y-50);ctx.lineTo(788,y-50);ctx.stroke()}
      ctx.fillStyle='#777';ctx.font='500 19px Vazirmatn, Tahoma, sans-serif';ctx.direction='rtl';ctx.textAlign='right';
      ctx.fillText(row[0],775,y,300);
      ctx.fillStyle='#111';ctx.font='800 20px Vazirmatn, Tahoma, sans-serif';
      ctx.textAlign='left';ctx.direction='ltr';
      ctx.fillText(row[1],125,y,360);
    });
    return await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
  }

  button.addEventListener('click',async function(){
    if(!whatsappUrl){status.textContent='لینک واتساپ پشتیبانی تنظیم نشده است.';return}
    let canShareFile=false;
    try{
      canShareFile=!!(typeof File!=='undefined' && navigator.share && navigator.canShare &&
        navigator.canShare({files:[new File(['receipt'],'receipt.png',{type:'image/png'})]}));
    }catch(e){canShareFile=false}
    // Open the requested WhatsApp chat directly from the click on browsers
    // without native file sharing; opening after an await can be popup-blocked.
    if(!canShareFile) window.open(whatsappUrl,'_blank');
    button.disabled=true;
    status.textContent='در حال آماده‌سازی تصویر رسید…';
    try{
      const blob=await createReceiptImage();
      if(!blob)throw new Error('blob_unavailable');
      const file=new File([blob],'payment-receipt.png',{type:'image/png'});
      if(canShareFile){
        try{
          await navigator.share({files:[file],title:'رسید پرداخت',text:shareText});
          status.textContent='در صورت انتخاب واتساپ، گفت‌وگوی مقصد را انتخاب و ارسال را تأیید کن.';
          return;
        }catch(e){
          if(e && e.name==='AbortError'){status.textContent='اشتراک‌گذاری لغو شد.';return}
        }
      }
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download='payment-receipt.png';
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url)},30000);
      if(canShareFile){
        const link=document.createElement('a');link.href=whatsappUrl;link.target='_blank';link.rel='noopener noreferrer';
        link.textContent='باز کردن چت واتساپ';status.textContent='عکس رسید ذخیره شد. ';
        status.appendChild(link);
      }else{
        status.textContent='عکس رسید ذخیره شد. در چت بازشده آن را پیوست کن و ارسال را تأیید کن.';
      }
    }catch(e){
      status.textContent='ساخت تصویر امکان‌پذیر نبود. ';
      const link=document.createElement('a');link.href=whatsappUrl;link.target='_blank';link.rel='noopener noreferrer';
      link.textContent='ارسال متن رسید در واتساپ';status.appendChild(link);
    }finally{button.disabled=false}
  });

  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
    const shades=['#181818','#555','#999','#c6c6c6'];
    for(let i=0;i<34;i++){
      const el=document.createElement('i');el.className='confetti';
      el.style.setProperty('--left',Math.random()*100+'vw');
      el.style.setProperty('--duration',(2.8+Math.random()*2.3)+'s');
      el.style.setProperty('--color',shades[i%shades.length]);
      el.style.setProperty('--rot',Math.random()*360+'deg');
      el.style.setProperty('--drift',(Math.random()*150-75)+'px');
      el.style.animationDelay=Math.random()*.8+'s';
      document.body.appendChild(el);el.addEventListener('animationend',function(){el.remove()});
    }
  }
})();
</script>
</body>
</html>
