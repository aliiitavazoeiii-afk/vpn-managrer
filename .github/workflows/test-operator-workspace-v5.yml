name: Test Hesab operator workspace V5
on:
  push:
    branches: [manual-sms-batch-operator-open]
    paths:
      - "patches/operator_workspace_v5.py"
      - "scripts/test_operator_workspace_v5.py"
      - "scripts/install_operator_workspace_v5.sh"
      - ".github/workflows/test-operator-workspace-v5.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate syntax
        run: |
          python -m py_compile patches/operator_workspace_v5.py scripts/test_operator_workspace_v5.py
          bash -n scripts/install_operator_workspace_v5.sh
      - name: Test template rendering and SMS parameter expansion
        run: |
          python -m pip install --quiet Jinja2==3.1.6
          python scripts/test_operator_workspace_v5.py
