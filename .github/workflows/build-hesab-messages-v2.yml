name: Build Hesab Messages V2 preview

on:
  push:
    branches:
      - hesab-messages-v2
    paths:
      - "android-sms-gateway/**"
      - ".github/workflows/build-hesab-messages-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build preview
        run: gradle -p android-sms-gateway :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          cp android-sms-gateway/app/build/outputs/apk/debug/app-debug.apk \
            Hesab-Messages-V2-PREVIEW.apk

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Hesab-Messages-V2-PREVIEW
          path: Hesab-Messages-V2-PREVIEW.apk
          if-no-files-found: error
          retention-days: 14
