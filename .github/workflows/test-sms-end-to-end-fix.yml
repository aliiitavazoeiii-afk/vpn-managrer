name: Test corrected debt SMS flow and one-pass queue reset
on:
  push:
    branches: [manual-sms-batch-operator-open]
    paths:
      - scripts/install_sms_resend_queue_reset_final.sh
      - scripts/reset_native_sms_app_queue_v1.py
      - patches/sms_native_v2.py
      - .github/workflows/test-sms-end-to-end-fix.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Syntax and lifecycle tests
        run: |
          bash -n scripts/install_sms_resend_queue_reset_final.sh
          python3 -m py_compile scripts/reset_native_sms_app_queue_v1.py patches/sms_native_v2.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path("scripts/install_sms_resend_queue_reset_final.sh").read_text()
          assert 'APP VERIFIED: correction route and canonical text loaded' in s
          assert 'ALL COMPONENTS STAGED: canonical text, waiting text, safe correction drafts' in s
          assert 'cp -a "$BACK/sms_aban_default.py" patches/sms_aban_default.py' in s
          assert 'canonical=_ABAN_SMS_PATTERN==expected' in s
          assert 'waiting=all(_ews_message(d)==expected' in s
          assert 'compose exec -T app python - <<' in s
          assert 'QUEUE RESET FAILED' in s
          assert 'reset_native_sms_app_queue_v1.py" --apply' in s
          assert 'compose up -d --no-deps --no-build --force-recreate app' in s
          assert 'SUCCESS: ONE-PASS CORRECTION INSTALLED AND PHONE APP QUEUE CLEARED' in s
          assert 'inspect.getsource' not in s
          assert 'sum(getattr(r,"path"' not in s
          q=Path("scripts/reset_native_sms_app_queue_v1.py").read_text()
          assert '"cp",str(path),"db:"+inside' in q
          assert '"pg_restore","--list",inside' in q
          assert "WHERE status IN ('queued','claimed','opened')" in q
          assert "DELETE FROM native_sms_v2_jobs" not in q
          print("PASS: live-code verified, single path, no duplicate reset or destructive actions")
          PY
      - name: Exercise SMS installer preflight and exact-file staging in temporary production fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ast, tempfile, subprocess
          script=Path("scripts/install_sms_resend_queue_reset_final.sh").read_text()
          begin='python3 - "$REPO" <<' + "'" + 'PY' + "'"
          assert script.count(begin)==1
          block=script.split(begin,1)[1].split("\nPY",1)[0]
          native=Path("patches/sms_native_v2.py").read_text()
          # Production's SMS-native file includes this appended overlay.
          # The repository deliberately keeps it as a separate patch source.
          native += "\\n\\n" + Path("patches/waiting_expiry_sms_v2.py").read_text()
          debt=Path("patches/sms_aban_default.py").read_text()
          def extract(code,name):
              match=[n for n in ast.parse(code).body
                     if isinstance(n,ast.FunctionDef) and n.name==name]
              assert len(match)==1
              return ast.get_source_segment(code,match[0])
          # Fixture reflects the old live code: queue handler without correction
          # guard, prior due-date rendering, and old canonical message.
          curr_enqueue=extract(native,"_ns_enqueue")
          old_enqueue='def _ns_enqueue(db, phone, source, message=""):\n    return "NATIVE_SMS_ALREADY_REGISTERED",_ns_clean_phone(phone)\n'
          curr_wait=extract(native,"_ews_message")
          old_wait='def _ews_message(expiry):\n    return "سلام اکانت شما ۳۰ شهریور تمام شده."\n'
          native=native.replace(curr_enqueue,old_enqueue,1).replace(curr_wait,old_wait,1)
          tree=ast.parse(debt)
          nodes=[n for n in tree.body if isinstance(n,ast.Assign) and
                 len(n.targets)==1 and isinstance(n.targets[0],ast.Name) and
                 n.targets[0].id=="_ABAN_SMS_PATTERN"]
          assert len(nodes)==1
          current=ast.get_source_segment(debt,nodes[0])
          old='''_ABAN_SMS_PATTERN = ("سلام اکانت شما {expiry} تمام شده.\\nusersmanager.ir")'''
          debt=debt.replace(current,old,1)
          with tempfile.TemporaryDirectory() as d:
              p=Path(d)
              (p/"patches").mkdir()
              (p/"patches/sms_native_v2.py").write_text(native)
              (p/"patches/sms_aban_default.py").write_text(debt)
              run=subprocess.run(["python3","-",str(Path.cwd())],input=block,
                      cwd=d,text=True,capture_output=True)
              assert run.returncode==0,run.stdout+"\n"+run.stderr
              n=(p/"patches/sms_native_v2.py").read_text()
              q=(p/"patches/sms_aban_default.py").read_text()
              enqueue=extract(n,"_ns_enqueue")
              waiting=extract(n,"_ews_message")
              nodes=[n for n in ast.parse(q).body if isinstance(n,ast.Assign)
                      and len(n.targets)==1 and isinstance(n.targets[0],ast.Name)
                      and n.targets[0].id=="_ABAN_SMS_PATTERN"]
              text=ast.literal_eval(nodes[0].value)
              assert "PREVIOUS_SMS_UNCERTAIN_OR_PENDING_REVIEW" in enqueue
              assert "CORRECTED_SMS_ALREADY_REGISTERED" in enqueue
              assert "return _ABAN_SMS_PATTERN" in waiting
              assert text.endswith("\n\nusersmanager.ir")
              assert text.startswith("سلام امروز موعد تمدید اکانت شماست")
              assert "{expiry}" not in text
              assert "نام" in q
              print("PASS: installer really updates BOTH production SMS files and new resend guard.")
          PY
      - name: Exercise actual native enqueue code against simulated SQL rows
        run: |
          python3 - <<'PY'
          import ast,re
          from pathlib import Path
          from datetime import date
          from types import SimpleNamespace
          source=Path("patches/sms_native_v2.py").read_text()
          node=next(n for n in ast.parse(source).body if isinstance(n,ast.FunctionDef) and n.name=="_ns_enqueue")
          class Column:
              def __eq__(self,value):return value
              def is_(self,value):return value
              def asc(self):return self
          class Subscription:
              phone=Column()
              is_free=Column()
              id=Column()
          class Result:
              def __init__(self, obj=None):self.obj=obj
              def first(self):return self.obj
              def mappings(self):return self
              def scalar_one(self):return 802
          class Query:
              def __init__(self,rows):self.rows=rows
              def filter(self,*args):return self
              def order_by(self,*args):return self
              def all(self):return self.rows
          class DB:
              def __init__(self,status,oldbody,newbody):
                  self.status=status;self.oldbody=oldbody;self.newbody=newbody
                  self.rows=[SimpleNamespace(id=115,expiry_date=date(2026,9,30),
                                  phone="09120000000",is_free=False)]
                  self.inserted=[];self.rolled_back=False
              def query(self,cls):return Query(self.rows)
              def execute(self,stmt,params=None):
                  if 'SELECT pg_advisory_xact_lock' in stmt:return Result()
                  if 'SELECT id FROM sms_jobs' in stmt:return Result()
                  if "SELECT id,status,message FROM native_sms_v2_jobs" in stmt:
                      return Result({'id':24,'status':self.status,'message':self.oldbody})
                  if "source='manual' AND phone=:phone AND cycle_key=:cycle" in stmt:
                      return Result()
                  if "created_at > NOW() - INTERVAL '1 day'" in stmt:return Result()
                  if 'INSERT INTO native_sms_v2_jobs' in stmt:
                      self.inserted.append(params);return Result()
                  raise RuntimeError('Unknown SQL '+stmt[:130])
              def rollback(self):self.rolled_back=True
              def add(self,item):pass
              def commit(self):pass
          expected="سلام امروز موعد تمدید اکانت شماست\nusersmanager.ir"
          scope={"_ns_setup":lambda db:None,
                 "_ns_clean_phone":lambda x:x,
                 "_ns_text":lambda x:x,
                 "_followup_states":lambda db:{},
                 "today_local":lambda:date(2026,10,23),
                 "Subscription":Subscription,
                 "current_debt_for":lambda s,now:100,
                 "_ABAN_SMS_PATTERN":expected,
                 "jdate":lambda d:d.isoformat(),
                 "AuditEvent":lambda **kw:kw}
          exec(compile(ast.Module(body=[node],type_ignores=[]),"native_enqueue_test","exec"),scope)
          enqueue=scope["_ns_enqueue"]
          for old_state,old_body,should_insert in [
             ("operator_opened","OLD 30 شهریور",True),
             ("cancelled","OLD 30 شهریور",True),
             ("queued","OLD 30 شهریور",False),
             ("opened","OLD 30 شهریور",False),
             ("uncertain","OLD 30 شهریور",False),
             ("operator_opened",expected,False),
          ]:
              db=DB(old_state,old_body,expected)
              job,error=enqueue(db,"09120000000","debt")
              assert bool(db.inserted)==should_insert,(old_state,job,error)
              if should_insert:
                  assert job==802 and error is None
                  assert db.inserted[0]["source"]=="manual"
                  assert db.inserted[0]["cycle"]=="2026-09-30"
                  assert db.inserted[0]["ids"]==[]
                  assert db.inserted[0]["body"]==expected
              else:
                  assert job is None and error
              print("PASS",old_state,"draft_created" if should_insert else "blocked",error or "")
          PY
