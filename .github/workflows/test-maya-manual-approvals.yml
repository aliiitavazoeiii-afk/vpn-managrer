name: Test Maya manual approved links
on:
  push:
    branches: [manual-sms-batch-operator-open]
    paths:
      - patches/maya_manual_links_v1.py
      - scripts/maya_apply_manual_links_v1.py
      - scripts/install_maya_manual_links_v1.sh
      - scripts/finish_maya_manual_links_v1.py
      - patches/maya_live_exclusion_counts_v1.py
      - scripts/install_maya_live_exclusion_counts_v1.sh
      - patches/maya_archived_link_readonly_v1.py
      - scripts/install_maya_archived_link_readonly_v1.sh
      - scripts/fix_maya_davari_afrogh_v1.py
      - scripts/diagnose_maya_paid_375_v1.py
      - .github/workflows/test-maya-manual-approvals.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Python and bash syntax
        run: |
          python -m py_compile patches/maya_manual_links_v1.py scripts/maya_apply_manual_links_v1.py scripts/finish_maya_manual_links_v1.py patches/maya_live_exclusion_counts_v1.py patches/maya_archived_link_readonly_v1.py scripts/fix_maya_davari_afrogh_v1.py scripts/diagnose_maya_paid_375_v1.py
          bash -n scripts/install_maya_archived_link_readonly_v1.sh
          bash -n scripts/install_maya_live_exclusion_counts_v1.sh
          bash -n scripts/install_maya_manual_links_v1.sh
      - name: Check precedence, explicit exclusion, vanished and archived IDs
        run: |
          python - <<'PY'
          import json,tempfile,types,unicodedata
          from pathlib import Path
          code=Path("patches/maya_manual_links_v1.py").read_text()
          class Sub:
              def __init__(self,ident,name):
                  self.id=ident
                  self.display_name=name
                  self.expiry_date=None
          subs={1:Sub(1,"one"),2:Sub(2,"two"),3:Sub(3,"alpha")}
          def normalize(v):return "".join(unicodedata.normalize("NFKC",str(v)).casefold().split())
          def financial(db):
              return ({normalize(s.display_name):[s] for s in subs.values()},
                      subs,{"old":{"id":2,"reason":"confirmed"},"excluded_old":{"id":None,"reason":"default"}},
                      {})
          space={"_ML_SERVERS":("maya1","maya-s3","maya4"),
                 "_ml_normalize":normalize,"_ml_financial_mapping":financial}
          exec(compile(code,"patches/maya_manual_links_v1.py","exec"),space)
          with tempfile.TemporaryDirectory() as d:
              p=Path(d)/"approved.json"
              p.write_text(json.dumps({"format":"HESAB_MAYA_APPROVALS_V1","servers":{
                  "maya1":{"old":{"sid":1},"personal":{"exclude":True}},
                  "maya-s3":{"alpha":{"sid":2},"removed":{"sid":999},
                             "private":{"exclude":True}}}}))
              p.chmod(0o600)
              space["_MA_FILE"]=p
              def client(x):return {"email":x,"client_enabled":False,"up_bytes":0,"down_bytes":0}
              r=space["_ml_resolve"]("maya1",list(map(client,["one","old","personal","excluded_old"])),None)
              by={x["email"]:x for x in r}
              assert by["old"]["sid"]==1 and by["old"]["reason"]=="manual_approved"
              assert by["one"]["sid"] is None, "Approved ID must outrank earlier exact name"
              assert by["personal"]["sid"] is None and by["personal"]["reason"]=="manual_excluded"
              assert by["excluded_old"]["reason"]=="legacy_excluded"
              r=space["_ml_resolve"]("maya-s3",list(map(client,["alpha","two","removed","private"])),None)
              by={x["email"]:x for x in r}
              assert by["alpha"]["sid"]==2
              assert by["two"]["sid"] is None
              assert by["removed"]["sid"] is None and by["removed"]["reason"]=="approved_account_not_active"
              assert by["private"]["sid"] is None
              p.write_text('{"format":"BAD","servers":{}}')
              try:space["_ma_approved"]();assert False,"Accepted invalid format"
              except ValueError:pass
              print("PASS: manual priority, exclusions, archived fail closed, approved no toggles")
          PY
      - name: Check safe local importer does not ship user data or auto toggle
        run: |
          python - <<'PY'
          from pathlib import Path
          importer=Path("scripts/maya_apply_manual_links_v1.py").read_text()
          installer=Path("scripts/install_maya_manual_links_v1.sh").read_text()
          overlay=Path("patches/maya_manual_links_v1.py").read_text()
          assert "live.sock" in importer
          assert "source.dashboard()" in importer
          assert "No finance records changed" in importer
          assert "_ml_call(\"toggle\"" not in overlay and "UPDATE subscriptions" not in overlay
          assert "c up -d --no-deps --no-build --force-recreate app" in installer
          assert "docker compose down" not in installer
          assert 'maya1_control.py' in installer
          print("PASS: only server-side mapping file is updated")
          PY

      - name: Test excluded users are not counted as unresolved
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path("patches/maya_live_exclusion_counts_v1.py").read_text()
          template=Path("patches/control_room_v2.py").read_text()
          rows=[
           {"sid":24,"reason":"manual_approved"},
           {"sid":None,"reason":"manual_excluded"},
           {"sid":None,"reason":"legacy_excluded"},
           {"sid":None,"reason":"unmatched_review"},
          ]
          def one(server,db):
              return {"rows":rows,"linked":1,"unmatched":3}
          env={"_ml_one":one,"TEMPLATES":{"control_room.html":template},
               "env":type("E",(),{"loader":type("L",(),{"mapping":{}})()})()}
          exec(compile(src,"status_overlay","exec"),env)
          report=env["_ml_one"]("maya1",None)
          assert report["linked"]==1
          assert report["excluded"]==2
          assert report["unmatched"]==1
          page=env["TEMPLATES"]["control_room.html"]
          assert 'count(data.excluded||0)+" مستثنا' in page
          assert '"بدون نیاز"' in page
          assert "تطبیق نشده" in page
          print("PASS: excluded users separated from real unresolved clients")
          PY

      - name: Test user-approved archived identity stays read-only
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path("patches/maya_archived_link_readonly_v1.py").read_text()
          tpl=Path("patches/maya_live_exclusion_counts_v1.py").read_text()
          original='item.control_ambiguous?"تعارض ورودی"'
          assert original in tpl, "exclusion overlay source must expose toggle label"
          class Sub:
              display_name="afroghhouman"
              expiry_date=None
          class DB:
              def get(self,cls,ident):return Sub() if ident==24 else None
          def old(server,clients,db):
              return [{"sid":None,"email":"afrogh hooman","reason":"approved_account_not_active",
                  "control_ambiguous":False,"name":"","finance_state":"","expiry":""}]
          env={"_ml_resolve":old,
              "_ma_approved":lambda:{"maya1":{"afrogh hooman":{"sid":24}}},
              "_followup_states":lambda db:{24:"cut"},
              "Subscription":Sub,
              "TEMPLATES":{"control_room.html":original},
              "env":type("E",(),{"loader":type("L",(),{"mapping":{}})()})()}
          exec(compile(src,"archive_overlay","exec"),env)
          user=env["_ml_resolve"]("maya1",[],DB())[0]
          assert user["sid"]==24 and user["finance_state"]=="cut"
          assert user["control_ambiguous"] is True
          assert user["reason"]=="approved_archived_read_only"
          env["_ma_approved"]=lambda:{"maya1":{"afrogh hooman":{"exclude":True}}}
          assert env["_ml_resolve"]("maya1",[],DB())[0]["sid"] is None
          env["_ma_approved"]=lambda:{"maya1":{"afrogh hooman":{"sid":24}}}
          env["_followup_states"]=lambda db:{}
          assert env["_ml_resolve"]("maya1",[],DB())[0]["sid"] is None
          assert "آرشیوشده · فقط نمایش" in env["TEMPLATES"]["control_room.html"]
          print("PASS: exact archived #24 read-only, explicit approval required")
          PY
