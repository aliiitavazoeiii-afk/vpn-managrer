name: Test live Maya three-server controls
on:
  push:
    branches: [manual-sms-batch-operator-open]
    paths:
      - "scripts/maya_live_bridge.py"
      - "scripts/maya_multi_panel_sync.py"
      - "patches/maya_live_dashboard.py"
      - "scripts/install_maya_live_v1.sh"
      - "scripts/bootstrap_maya_ssh_tunnel.sh"
      - ".github/workflows/test-maya-live-v1.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify three-server live app/daemon and Jinja page
        run: |
          python -m py_compile scripts/maya_live_bridge.py scripts/maya_multi_panel_sync.py patches/maya_live_dashboard.py
          bash -n scripts/install_maya_live_v1.sh
          pip install --quiet Jinja2==3.1.6
          python - <<'PY'
          import ast
          from pathlib import Path
          from jinja2 import Environment
          for path,label in [
              ("patches/maya_live_dashboard.py","_ML_SECTION"),
              ("patches/maya_extra_panel.py","_MX_TEMPLATE"),
          ]:
              tree=ast.parse(Path(path).read_text())
              template=next(ast.literal_eval(node.value) for node in tree.body
                  if isinstance(node,ast.Assign)
                  and any(isinstance(v,ast.Name) and v.id==label for v in node.targets))
              Environment().parse(template)
              assert len(template)>100
          patch=Path("patches/maya_live_dashboard.py").read_text()
          bridge=Path("scripts/maya_live_bridge.py").read_text()
          connector=Path("scripts/maya_multi_panel_sync.py").read_text()
          installer=Path("scripts/install_maya_live_v1.sh").read_text()
          assert '"maya1","maya-s3","maya4"' in patch
          assert "maya1" in connector and 'http.cookiejar' in connector
          assert 'client_enabled' in connector
          assert 'bulkEnable' in bridge and 'bulkDisable' in bridge
          assert 'get("client_enabled"' in bridge
          assert 'app.add_api_route("/control-room/maya-live/toggle"' in patch
          assert 'compare_digest(token,csrf)' in patch
          assert 'source_generated_at' not in bridge
          assert "live.sock" in installer
          assert 'ProtectSystem=full' in installer
          assert 'No X-UI clients changed during installation' in installer
          print("PASS: Jinja, syntax, dynamic roster and guarded manual client toggles")
          PY

      - name: Verify copied panel URL normalization
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,"scripts")
          import maya_multi_panel_sync as maya
          base="https://example.invalid:2095/custompath"
          assert maya.panel_base(base+"/panel/")==base
          assert maya.panel_base(base+"/panel")==base
          assert maya.panel_base(base+"/")==base
          assert maya.panel_base(base)==base
          assert (maya.panel_base(base+"/panel/")+"/login")==base+"/login"
          assert (maya.panel_base(base+"/panel/")+"/panel/api/inbounds/list")==base+"/panel/api/inbounds/list"
          print("PASS: copied 3x-ui panel path normalized once")
          PY

      - name: Validate SSH-only tunnel transport configuration
        run: |
          bash -n scripts/bootstrap_maya_ssh_tunnel.sh
          python - <<'PY'
          import ast, pathlib, sys
          sys.path.insert(0,"scripts")
          import maya_multi_panel_sync as x
          code=pathlib.Path("scripts/maya_multi_panel_sync.py").read_text()
          assert 'transport","https"' in code
          assert 'mode=="ssh"' in code
          assert 'StrictHostKeyChecking=yes' in code
          assert '127.0.0.1:{remote_port}' in code
          assert 'ProxyHandler({})' in code
          assert 'panel_connection(details)' in code
          assert 'https' in x.panel_base("https://example.org:2095/path/panel/")
          config={"transport":"ssh","ssh_host":"5.10.249.206","server":"maya-s3",
                  "remote_port":2095,"panel_path":"/custom"}
          # Missing SSH key must fail before HTTP authentication can occur.
          try:
              with x.panel_connection(config):pass
          except RuntimeError as exc:
              assert "SSH key missing" in str(exc)
          else:raise AssertionError("insecure HTTP path unexpectedly accepted")
          print("PASS: plaintext HTTP requires SSH key and verified host identity")
          PY

      - name: Exercise safe API toggles with mocked panels
        run: |
          python - <<'PY'
          import sys,copy
          sys.path.insert(0,"scripts")
          import maya_live_bridge as live
          uid="12345678-1234-1234-1234-123456789abc"
          email="example-client"
          details={"url":"https://panel.example.test","mode":"token","token":"stub"}
          state={"enabled":False,"calls":[],"old":False}
          def snapshot(server,auth):
              assert server=="maya1"
              return {"clients":[{"email":email,"client_enabled":state["enabled"],
                                  "enabled":state["enabled"],"control_ambiguous":False}]}
          def api(opener,url,payload=None,headers=None):
              state["calls"].append((url,payload))
              if url.endswith("/bulkEnable"):
                  if state["old"]:
                      raise RuntimeError("X-UI API returned HTTP 404")
                  assert payload=={"emails":[email]}
                  state["enabled"]=True
                  return {"success":True}
              if url.endswith("/inbounds/list"):
                  return {"success":True,"obj":[{
                      "id":5,"protocol":"vless",
                      "settings":{"clients":[{"email":email,"id":uid,"enable":state["enabled"],
                                              "flow":"xtls-rprx-vision"}]}}]}
              if "/updateClient/" in url:
                  assert payload["id"]==5
                  import json
                  c=json.loads(payload["settings"])["clients"][0]
                  assert c["id"]==uid and c["flow"]=="xtls-rprx-vision"
                  assert c["enable"] is True
                  state["enabled"]=True
                  return {"success":True}
              raise AssertionError("Unexpected URL "+url)
          live.snapshot=snapshot
          from contextlib import contextmanager
          @contextmanager
          def fake_connection(details):
              yield object(),"https://panel.example.test/",{}
          live.maya.panel_connection=fake_connection
          live.maya.request_json=api
          assert live.send_enable("maya1",details,email,False,True)["client_enabled"] is True
          assert len(state["calls"])==1
          state.update(enabled=False,calls=[],old=True)
          assert live.send_enable("maya1",details,email,False,True)["client_enabled"] is True
          assert len(state["calls"])==4
          state.update(enabled=True,calls=[],old=False)
          try:live.send_enable("maya1",details,email,False,True)
          except ValueError:pass
          else:raise AssertionError("stale expected state accepted")
          assert not state["calls"]
          print("PASS: modern, legacy VLESS and stale-state lock tests")
          PY
