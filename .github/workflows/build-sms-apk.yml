name: Build Hesab WhatsApp Manual APK

on:
  push:
    branches:
      - sms-app
      - android-sms-safe-v2
      - google-messages-manual-handoff
      - manual-sms-batch-operator-open
      - whatsapp-manual-operator-open
    paths:
      - "android-sms-gateway/**"
      - "sms_gateway/server.py"
      - "patches/sms_native_v2.py"
      - "scripts/install_native_sms_v2_safe.sh"
      - "scripts/install_sent_sms_confirmation.sh"
      - "scripts/install_batch_operator_open.sh"
      - "scripts/install_waiting_renewal_sms.sh"
      - "patches/waiting_sms_reminder.py"
      - "scripts/install_waiting_sms_reminder.sh"
      - ".github/workflows/build-sms-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify WhatsApp composer and unchanged site queue contract
        shell: bash
        run: |
          python3 -m py_compile sms_gateway/server.py patches/sms_native_v2.py
          bash -n scripts/install_batch_operator_open.sh
          bash -n scripts/install_waiting_renewal_sms.sh
          bash -n scripts/install_waiting_sms_reminder.sh
          python3 -m py_compile patches/waiting_sms_reminder.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          from types import SimpleNamespace
          original=Path("patches/waiting_compact.py").read_text()
          patch=Path("patches/waiting_sms_reminder.py").read_text()
          base=re.search(r"WAITING_COMPACT_TEMPLATE = r'''(.*?)'''",original,re.S).group(1)
          env=SimpleNamespace(loader=SimpleNamespace(mapping={}))
          scope={"TEMPLATES":{"followups.html":base},"env":env}
          for name in ("_WS_BOX","_WS_STYLE","_WS_SCRIPT"):
              scope[name]=re.search(r"^"+name+r" = r'''(.*?)'''",patch,re.M|re.S).group(1)
          tail=patch.split('_ws_tpl = TEMPLATES.get',1)[1]
          exec('_ws_tpl = TEMPLATES.get'+tail,scope)
          page=scope["TEMPLATES"]["followups.html"]
          assert page.count('<div class="waiting-sms-reminder-box" data-waiting-sms-reminder-box>')==1
          assert "سلام وقت بخیر، اکانتتون تمدید بشه؟" in page
          assert "/followups/sms-reminder" in page
          assert "type=\"button\"" in page
          assert 'current_debt_for(s,now)>0' in patch
          assert '_ns_enqueue(db,normalized,"manual",_WS_BODY)' in patch
          print("PASS: waiting box renders into existing group without changing payments")
          PY
          python3 - <<'PY'
          from pathlib import Path
          root=Path("android-sms-gateway/app/src/main/java/ir/filmjadiid/hesabsms")
          manifest=Path("android-sms-gateway/app/src/main/AndroidManifest.xml").read_text()
          activity=(root/"MainActivity.java").read_text()
          api=(root/"ApiClient.java").read_text()
          server=Path("sms_gateway/server.py").read_text()
          page=Path("patches/sms_native_v2.py").read_text()
          assert "android.permission.SEND_SMS" not in manifest
          assert "android.permission.READ_SMS" not in manifest
          assert "GatewayService" not in manifest
          assert not (root/"GatewayService.java").exists()
          assert not (root/"SentSmsVerifier.java").exists()
          assert "setContentView(screen);" in activity
          helper=(root/"WhatsAppLink.java").read_text()
          assert "Intent.ACTION_VIEW" in activity and "WhatsAppLink.link" in activity
          assert "com.whatsapp" in activity and "com.whatsapp.w4b" in activity
          assert "Intent.ACTION_SENDTO" not in activity and '"sms_body"' not in activity
          assert "smsto:" not in activity and "Google Messages" not in activity
          assert "https://wa.me/" in helper and "whatsapp://send" in helper
          assert '"98" + phone.substring(1)' in helper
          assert "ApiClient.pending(" in activity
          assert "REFRESH_MS=4000L" in activity
          assert "ApiClient.operatorOpened" in activity
          assert "/v4/drafts/pending" in server and "/v4/drafts/{job_id}/operator-open" in server
          assert "operator_opened" in server and "followup_waiting" in server
          assert "sent_confirmed" in server and "False" in server
          assert "درخواست به صف گوشی اضافه شد" in page
          assert "HESAB_WAITING_RENEWAL_SMS_V1" in page
          assert 'سلام وقت بخیر، اکانتتون تمدید بشه؟' in page
          assert 'waiting-head-pay waiting-pay-tools' in page
          assert 'data-waiting-renewal-form' in page
          assert '/sms/waiting-renewal' in page
          assert 'source=="debt"' not in page.split("HESAB_WAITING_RENEWAL_SMS_V1",1)[1]
          assert 'event.stopImmediatePropagation()' in page

          assert "/v4/drafts/pending" in api
          print("PASS: WhatsApp manual compose, no SMS send, same batch queue/operator-open transition")
          PY

      - name: Run WhatsApp link unit tests
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(mktemp -d)"
          javac -encoding UTF-8 -d "$OUT" \
            android-sms-gateway/app/src/main/java/ir/filmjadiid/hesabsms/WhatsAppLink.java \
            android-sms-gateway/tests/WhatsAppLinkTest.java
          java -cp "$OUT" WhatsAppLinkTest

      - name: Build debug APK
        run: gradle -p android-sms-gateway :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android-sms-gateway/app/build/outputs/apk/debug/app-debug.apk              android-sms-gateway/app/build/outputs/apk/debug/Hesab-WhatsApp-Manual.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hesab-WhatsApp-Manual
          path: android-sms-gateway/app/build/outputs/apk/debug/Hesab-WhatsApp-Manual.apk
          if-no-files-found: error
          retention-days: 30
