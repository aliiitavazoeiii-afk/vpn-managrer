name: Build Hesab SMS Gateway APK

on:
  push:
    branches:
      - sms-app
      - android-sms-safe-v2
    paths:
      - "android-sms-gateway/**"
      - ".github/workflows/build-sms-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify SMS V2 fail-closed source contracts
        shell: bash
        run: |
          python3 -m py_compile sms_gateway/server.py patches/sms_native_v2.py
          python3 - <<'PY'
          from pathlib import Path
          root=Path("android-sms-gateway/app/src/main/java/ir/filmjadiid/hesabsms")
          worker=(root/"GatewayService.java").read_text()
          sender=(root/"SmsSender.java").read_text()
          preferences=(root/"Prefs.java").read_text()
          api=(root/"ApiClient.java").read_text()
          backend=Path("sms_gateway/server.py").read_text()
          assert "ApiClient.markAttempting" in worker
          assert 'reportStatus(this, job.id, "dispatching"' not in worker
          assert "Prefs.begin(this, job.id)" in worker
          assert "Prefs.allowedTestRecipient(this, job.phone)" in worker
          assert "Prefs.allowedTestRecipient(c, phone)" in sender
          assert 'putBoolean("enabled",false)' in preferences
          assert '"&test_phone=" + phone' in api
          assert "WHERE status='queued' AND phone=%s" in backend
          print("PASS: native V2 test-only and no-retry contracts")
          PY

      - name: Build debug APK
        run: gradle -p android-sms-gateway :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android-sms-gateway/app/build/outputs/apk/debug/app-debug.apk              android-sms-gateway/app/build/outputs/apk/debug/Hesab-SMS-Gateway.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hesab-SMS-Gateway
          path: android-sms-gateway/app/build/outputs/apk/debug/Hesab-SMS-Gateway.apk
          if-no-files-found: error
          retention-days: 30
