name: Build Hesab SMS Gateway APK

on:
  push:
    branches:
      - sms-app
    paths:
      - "android-sms-gateway/**"
      - ".github/workflows/build-sms-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle -p android-sms-gateway :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android-sms-gateway/app/build/outputs/apk/debug/app-debug.apk              android-sms-gateway/app/build/outputs/apk/debug/Hesab-SMS-Gateway.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hesab-SMS-Gateway
          path: android-sms-gateway/app/build/outputs/apk/debug/Hesab-SMS-Gateway.apk
          if-no-files-found: error
          retention-days: 30
