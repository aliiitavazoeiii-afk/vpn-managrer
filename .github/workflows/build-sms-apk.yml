name: Build Hesab SMS Gateway APK

on:
  push:
    branches:
      - sms-app
      - android-sms-safe-v2
      - google-messages-manual-handoff
    paths:
      - "android-sms-gateway/**"
      - "sms_gateway/server.py"
      - "patches/sms_native_v2.py"
      - "scripts/install_native_sms_v2_safe.sh"
      - "scripts/install_sent_sms_confirmation.sh"
      - ".github/workflows/build-sms-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify manual handoff has no SMS modem access
        shell: bash
        run: |
          python3 -m py_compile sms_gateway/server.py patches/sms_native_v2.py
          bash -n scripts/install_sent_sms_confirmation.sh
          python3 - <<'PY'
          from pathlib import Path
          root=Path("android-sms-gateway/app/src/main/java/ir/filmjadiid/hesabsms")
          manifest=Path("android-sms-gateway/app/src/main/AndroidManifest.xml").read_text()
          activity=(root/"MainActivity.java").read_text()
          worker=(root/"GatewayService.java").read_text()
          api=(root/"ApiClient.java").read_text()
          server=Path("sms_gateway/server.py").read_text()
          assert "android.permission.SEND_SMS" not in manifest
          assert "android.permission.READ_SMS" in manifest
          assert "SmsSender.send(" not in worker
          assert "ApiClient.pollDraft(" in worker
          assert "Intent.ACTION_SENDTO" in activity and '"sms_body"' in activity
          assert "SentSmsVerifier.matchingSentSms" in worker
          assert "Prefs.clearDraft(this);" not in activity.split("private void openDraft()",1)[1].split("private void updateStatus()",1)[0]
          assert "Telephony.Sms.Sent.CONTENT_URI" in (root/"SentSmsVerifier.java").read_text()
          assert "verified-sent" in server and "followup_waiting" in server
          assert "setContentView(scroll);" in activity, "MainActivity must attach view, otherwise app launches blank"
          assert "/v3/drafts/next" in server
          assert "/v3/drafts/next" in api
          print("PASS: manual handoff, no modem send")
          PY

      - name: Build debug APK
        run: gradle -p android-sms-gateway :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android-sms-gateway/app/build/outputs/apk/debug/app-debug.apk              android-sms-gateway/app/build/outputs/apk/debug/Hesab-SMS-Gateway.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hesab-SMS-Gateway
          path: android-sms-gateway/app/build/outputs/apk/debug/Hesab-SMS-Gateway.apk
          if-no-files-found: error
          retention-days: 30
