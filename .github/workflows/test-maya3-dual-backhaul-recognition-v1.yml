name: Maya3 dual-Backhaul Control Room migration

on:
  push:
    branches: [feat/maya-nic-traffic-history-v11]
    paths:
      - 'scripts/maya_dual_hourly_collect_v1.py'
      - 'scripts/test_maya_dual_hourly_v1.py'
      - 'scripts/patch_maya3_dual_backhaul_ui_v1.py'
      - 'scripts/install_maya3_dual_backhaul_recognition_v1.sh'
      - 'scripts/install_maya1_dual_backhaul_monitor_v1.sh'
      - '.github/workflows/test-maya3-dual-backhaul-recognition-v1.yml'
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python and validate Bash
        run: |
          python3 -m py_compile scripts/maya_dual_hourly_collect_v1.py \
            scripts/test_maya_dual_hourly_v1.py \
            scripts/patch_maya3_dual_backhaul_ui_v1.py
          bash -n scripts/install_maya3_dual_backhaul_recognition_v1.sh
          bash -n scripts/install_maya1_dual_backhaul_monitor_v1.sh
      - name: Legacy + Maya3 compatibility and label tests
        run: |
          python3 -m pip install --quiet jinja2
          python3 scripts/test_maya_dual_hourly_v1.py
