name: Build Hesab WhatsApp Maya Low Traffic Alert V12
on:
  push:
    branches:
      - feat/maya-low-traffic-android-alert-v12
    paths:
      - "android-sms-gateway/**"
      - "patches/sms_maya_low_traffic_v12.py"
      - "scripts/test_maya_low_traffic_v12.py"
      - "scripts/install_maya_low_traffic_android_v12.sh"
      - ".github/workflows/build-maya-whatsapp-alert-v12.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Validate isolated backend, threshold tests and safe installer
        run: |
          python3 -m py_compile patches/sms_maya_low_traffic_v12.py sms_gateway/server.py scripts/test_maya_low_traffic_v12.py
          python3 scripts/test_maya_low_traffic_v12.py
          bash -n scripts/install_maya_low_traffic_android_v12.sh
      - name: Preserve WhatsApp manual flow and no SMS auto-send
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("android-sms-gateway/app/src/main/java/ir/filmjadiid/hesabsms")
          activity=(root/"MainActivity.java").read_text()
          job=(root/"MayaTrafficAlertJob.java").read_text()
          manifest=Path("android-sms-gateway/app/src/main/AndroidManifest.xml").read_text()
          gradle=Path("android-sms-gateway/app/build.gradle").read_text()
          helper=(root/"WhatsAppLink.java").read_text()
          assert "WhatsAppLink.link" in activity and "com.whatsapp" in activity
          assert "operatorOpened" in activity and "ApiClient.pending" in activity
          assert "Intent.ACTION_SENDTO" not in activity
          assert "SEND_SMS" not in manifest and "READ_SMS" not in manifest
          assert "MayaTrafficAlertJob" in manifest
          assert "POST_NOTIFICATIONS" in manifest and "RECEIVE_BOOT_COMPLETED" in manifest
          assert "BIND_JOB_SERVICE" in manifest
          assert "15L*60L*1000L" in job
          assert "setPersisted(true)" in job
          assert "v5/maya/low-traffic" in job
          assert 'applicationId "ir.filmjadiid.hesabsms"' in gradle
          assert "versionCode 8" in gradle
          assert "https://wa.me/" in helper
          print("WHATSAPP_MANUAL_FLOW_AND_LOW_TRAFFIC_JOB=PASS")
          PY
      - name: WhatsApp URL encoding unit tests
        shell: bash
        run: |
          OUT="$(mktemp -d)"
          javac -encoding UTF-8 -d "$OUT" \
            android-sms-gateway/app/src/main/java/ir/filmjadiid/hesabsms/WhatsAppLink.java \
            android-sms-gateway/tests/WhatsAppLinkTest.java
          java -cp "$OUT" WhatsAppLinkTest
      - name: Build Android debug APK
        run: gradle -p android-sms-gateway :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hesab-WhatsApp-Maya-Alert-V12
          path: android-sms-gateway/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
