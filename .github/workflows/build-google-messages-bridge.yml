name: Build Hesab Google Messages Chrome Bridge

on:
  push:
    branches:
      - google-messages-chrome-bridge
    paths:
      - "chrome-google-messages/**"
      - "patches/sms_browser_bridge.py"
      - "scripts/fix_browser_sms_history_block.sh"
      - ".github/workflows/build-google-messages-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check chrome-google-messages/hesab.js
          node --check chrome-google-messages/background.js
          node --check chrome-google-messages/popup.js

      - name: Test safe form field extraction
        run: node --test chrome-google-messages/tests/read-message.test.cjs

      - name: Test recipient selection and draft-only safety
        run: node --test chrome-google-messages/tests/recipient-choice.test.cjs

      - name: Validate standalone backend bridge and safe installer
        run: |
          python3 -m py_compile patches/sms_browser_bridge.py
          bash -n scripts/install_browser_sms_bridge.sh
          bash -n scripts/fix_browser_sms_history_block.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path("patches/sms_browser_bridge.py").read_text()
          assert 'sms_browser_intents' in p
          assert 'browser_submitted' in p
          assert 'delivery_confirmed":False' in p
          assert '_followup_set' in p
          assert 'DEBT_MESSAGE_CHANGED_REVIEW_REQUIRED' in p
          assert 'BROWSER_BRIDGE_REQUIRED_NO_GATEWAY_QUEUE' in p
          assert 'INSERT INTO sms_jobs' not in p
          assert "message=:body" in p
          assert "status IN ('sent','delivered','operator_confirmed')" in p
          assert "EXISTING_LEGACY_SMS_CHECK_HISTORY" not in p
          assert "created_at >= :jalali_start" not in p
          assert 'status=\'delivered\'' not in p
          print("Safe browser intent backend and installer compiled")
          PY

      - name: Check manifest and narrow scopes
        run: |
          node - <<'JS'
          const fs=require('fs'),assert=require('assert');
          const p='chrome-google-messages/';
          const m=JSON.parse(fs.readFileSync(p+'manifest.json','utf8'));
          assert.equal(m.manifest_version,3);
          assert.deepEqual(m.host_permissions,['https://messages.google.com/*']);
          assert.deepEqual(m.content_scripts[0].matches,['https://hesab.filmjadiid.ir/*']);
          assert(!m.permissions.includes('debugger'));
          assert(!m.permissions.includes('webRequest'));
          const site=fs.readFileSync(p+'hesab.js','utf8');
          assert(site.includes('event.preventDefault()'));
          assert(site.includes('event.stopImmediatePropagation()'));
          assert(site.includes('/sms/debt-send'));
          assert(site.includes('/sms/send'));
          assert(!site.includes("fetch('/sms/debt-send'"));
          const bg=fs.readFileSync(p+'background.js','utf8');
          assert(bg.includes('autoSend:true'));
          assert(site.includes('/sms/browser/begin'));
          assert(site.includes('/sms/browser/finish'));
          assert(bg.includes('AMBIGUOUS_SEND'));
          console.log('Chrome extension manifest, form interception and guarded one-click mode PASS');
          JS

      - name: Create installable extension ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          root=Path("chrome-google-messages")
          names=["manifest.json","hesab.js","background.js","popup.html","popup.js","README.md"]
          with ZipFile("Hesab-Google-Messages-Bridge.zip","w",ZIP_DEFLATED) as archive:
              for name in names:
                  assert (root/name).is_file()
                  archive.write(root/name,name)
          print("PACKAGED",names)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: Hesab-Google-Messages-Bridge
          path: Hesab-Google-Messages-Bridge.zip
          if-no-files-found: error
          retention-days: 30
