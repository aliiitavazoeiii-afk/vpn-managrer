plugins {
    id "com.android.application"
}

android {
    namespace "ir.filmjadiid.hesabsms"
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "ir.filmjadiid.hesabsms"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "3.0.0-manual"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
